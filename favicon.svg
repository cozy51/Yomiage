<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1541a6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- speech bubble -->
  <path d="M 118 158
           h 210
           a 40 40 0 0 1 40 40
           v 96
           a 40 40 0 0 1 -40 40
           h -134
           l -46 44
           a 6 6 0 0 1 -10 -4.5
           v -39.5
           h -20
           a 40 40 0 0 1 -40 -40
           v -96
           a 40 40 0 0 1 40 -40
           z"
        fill="#ffffff"/>

  <!-- sound waves -->
  <path d="M 300 244 A 30 30 0 0 1 300 304" fill="none" stroke="#2563eb" stroke-width="15" stroke-linecap="round"/>
  <circle cx="188" cy="274" r="16" fill="#2563eb"/>
  <circle cx="240" cy="274" r="16" fill="#2563eb"/>

  <!-- outer emitted sound arcs -->
  <path d="M 372 196 A 96 96 0 0 1 372 352" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" opacity="0.9"/>
  <path d="M 410 158 A 148 148 0 0 1 410 390" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.55"/>
</svg>

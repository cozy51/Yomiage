<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ブラウザだけで使える、日本語の文章読み上げアプリです。">
  <title>文章読み上げ</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <img class="title-icon" src="favicon.svg" alt="" width="54" height="54" aria-hidden="true">
      <div>
        <h1>文章読み上げ</h1>
        <p>入力した文章をブラウザの音声で読み上げます</p>
      </div>
    </header>

    <section class="card" aria-labelledby="input-label">
      <div class="quick-mode" role="radiogroup" aria-label="処理方法（簡易選択）">
        <label class="quick-option">
          <input type="radio" name="quick-mode" value="plain" checked>
          <span class="quick-option-text">🔊 そのまま</span>
        </label>
        <label class="quick-option">
          <input type="radio" name="quick-mode" value="ai-ocr">
          <span class="quick-option-text">🔍 高精度</span>
        </label>
        <label class="quick-option">
          <input type="radio" name="quick-mode" value="summarize">
          <span class="quick-option-text">📝 要約</span>
        </label>
        <label class="quick-option">
          <input type="radio" name="quick-mode" value="translate">
          <span class="quick-option-text">🌐 翻訳</span>
        </label>
      </div>

      <button id="clipboard-button" class="button button-primary clipboard-button" type="button">
        <span aria-hidden="true">📋</span> <span class="nowrap">クリップボードの文章・画像を</span><span class="nowrap">読み上げ</span>
      </button>

      <label class="ai-voice-toggle" for="ai-voice-toggle">
        <input type="checkbox" id="ai-voice-toggle">
        <span class="ai-voice-toggle-text">✨ AI音声で読み上げ<span class="ai-voice-toggle-price">（有料）</span></span>
      </label>

      <p id="status" class="status" role="status" aria-live="polite">待機中</p>

      <div class="controls" aria-label="読み上げ操作">
        <button id="speak-button" class="button button-clipboard" type="button">
          <span aria-hidden="true">▶</span> 読み上げ
        </button>
        <button id="pause-button" class="button button-secondary" type="button" disabled>
          <span aria-hidden="true">⏸</span> 一時停止
        </button>
        <button id="stop-button" class="button button-danger" type="button" disabled>
          <span aria-hidden="true">■</span> 停止
        </button>
      </div>

      <div class="input-heading">
        <div class="input-heading-main">
          <label id="input-label" for="text-input">入力テキスト</label>
          <button id="copy-button" class="copy-button" type="button">
            <span aria-hidden="true">📄</span> コピー
          </button>
        </div>
        <span id="character-count" aria-live="polite">0文字</span>
      </div>
      <textarea
        id="text-input"
        rows="5"
        placeholder="ここに読み上げたい日本語の文章を入力、または貼り付けてください。"
        aria-describedby="input-help"
      ></textarea>
      <p id="input-help" class="input-help">入力欄へ文章を貼り付けると、以前の文章を消してすぐに読み上げます。PDFなどからコピーした文章は、折り返しの改行をつなぎ直します。画像を貼り付けた場合は、文字を読み取って入力します。</p>

      <section id="ai-result" class="ai-result" aria-labelledby="ai-result-label" hidden>
        <div class="input-heading">
          <div class="input-heading-main">
            <label id="ai-result-label" for="ai-result-input">AIの結果</label>
            <span id="ai-result-kind" class="ai-result-kind"></span>
            <button id="ai-result-copy" class="copy-button" type="button">
              <span aria-hidden="true">📄</span> コピー
            </button>
            <button id="ai-result-clear" class="copy-button" type="button">
              <span aria-hidden="true">✕</span> 消す
            </button>
          </div>
          <span id="ai-result-count" aria-live="polite">0文字</span>
        </div>
        <textarea id="ai-result-input" rows="5" aria-describedby="ai-result-help"></textarea>
        <p id="ai-result-help" class="input-help">読み上げるのは、こちらの文章です。「消す」を押すと、上の文章を読み上げます。</p>
      </section>

      <fieldset class="process-mode">
        <legend>処理方法</legend>

        <label class="process-option">
          <input type="radio" name="process-mode" value="plain" checked>
          <span class="process-option-body">
            <span class="process-option-title">🔊 そのまま読み上げ</span>
            <span class="process-option-note">画像の場合は無料OCRで文字を読み取ります。AIは使いません。</span>
          </span>
        </label>

        <label class="process-option">
          <input type="radio" name="process-mode" value="ai-ocr">
          <span class="process-option-body">
            <span class="process-option-title">🔍 高精度OCRで読み上げ</span>
            <span class="process-option-note">画像をGeminiで高精度に読み取って、そのまま読み上げます。</span>
          </span>
        </label>

        <label class="process-option">
          <input type="radio" name="process-mode" value="summarize">
          <span class="process-option-body">
            <span class="process-option-title">📝 要約して読み上げ</span>
            <span class="process-option-note">文章をAIで短くまとめて読み上げます。</span>
          </span>
        </label>

        <label class="process-option">
          <input type="radio" name="process-mode" value="translate">
          <span class="process-option-body">
            <span class="process-option-title">🌐 翻訳して読み上げ</span>
            <span class="process-option-note">文章をAIで翻訳して読み上げます。</span>
          </span>
        </label>

        <div id="translate-language-field" class="process-language" hidden>
          <label for="translate-language">翻訳先の言語</label>
          <select id="translate-language">
            <option value="ja">日本語</option>
            <option value="en">英語</option>
            <option value="zh">中国語</option>
            <option value="ko">韓国語</option>
          </select>
        </div>
      </fieldset>

      <div class="settings" aria-label="読み上げ設定">
        <div class="setting-field voice-field">
          <label for="voice-select">音声（ブラウザ・無料）</label>
          <select id="voice-select">
            <option value="">音声を読み込んでいます…</option>
          </select>

          <label class="ai-voice-label" for="ai-voice-select">✨ AI音声（Gemini・有料）</label>
          <select id="ai-voice-select" aria-describedby="voice-note"></select>
          <p id="voice-note" class="voice-note"></p>
        </div>

        <div class="setting-field speed-field">
          <div class="speed-label">
            <label for="rate-input">読み上げ速度</label>
            <output id="rate-output" for="rate-input">2.0倍</output>
          </div>
          <input id="rate-input" type="range" min="0.5" max="2" step="0.1" value="2" aria-valuetext="2.0倍">
          <div class="range-labels" aria-hidden="true"><span>0.5倍</span><span>2.0倍</span></div>
        </div>
      </div>

      <div class="download-controls">
        <button id="download-button" class="button button-secondary" type="button" hidden>
          <span aria-hidden="true">⬇</span> <span class="nowrap">音声を保存</span>
        </button>
      </div>

      <div id="ocr-progress" class="ocr-progress" hidden>
        <div class="ocr-progress-bar"><div id="ocr-progress-fill" class="ocr-progress-fill"></div></div>
        <p id="ocr-progress-label" class="ocr-progress-label" role="status" aria-live="polite">準備中… 0%</p>
      </div>
    </section>

    <section id="current-section" class="card current-card" aria-labelledby="current-title" tabindex="0" hidden>
      <h2 id="current-title"><span class="speaking-dot" aria-hidden="true"></span><span id="current-title-text">現在読み上げ中</span><span id="current-source" class="current-chip"></span><span id="current-ai" class="current-chip current-ai"></span></h2>
      <p id="current-text"></p>
      <div class="page-nav">
        <button id="prev-button" class="page-button" type="button" aria-label="前のページへ" title="前のページへ（←キー）" disabled>
          <span aria-hidden="true">◀</span>
        </button>
        <div id="progress-text" class="progress-text"></div>
        <button id="next-button" class="page-button" type="button" aria-label="次のページへ" title="次のページへ（→キー）" disabled>
          <span aria-hidden="true">▶</span>
        </button>
      </div>
      <p class="current-hint">タップまたはクリックで一時停止 / 再生<br>◀ ▶ または ← → キーでページ送り</p>
    </section>

    <dialog id="password-dialog" class="password-dialog" aria-labelledby="password-title">
      <form id="password-form">
        <h2 id="password-title">AIの機能を利用するには<br>パスワードを入力してください</h2>
        <label class="password-label" for="password-input">パスワード</label>
        <input id="password-input" type="password" autocomplete="current-password" required>
        <p id="password-error" class="password-error" role="alert" hidden></p>
        <div class="password-actions">
          <button id="password-cancel" class="button button-secondary" type="button">キャンセル</button>
          <button id="password-submit" class="button button-primary" type="submit">認証して利用</button>
        </div>
      </form>
    </dialog>

    <noscript>このアプリを使用するにはJavaScriptを有効にしてください。</noscript>
  </main>

  <script src="script.js"></script>
</body>
</html>
